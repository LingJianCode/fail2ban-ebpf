services:
  fail2ban-ebpf:
    image: docker.cnb.cool/lingjiancode/fail2ban-ebpf:latest 
    container_name: fail2ban-ebpf
    privileged: true
    pid: host
    network_mode: host
    restart: unless-stopped
    working_dir: /app
    command: ["-config", "/etc/fail2ban-ebpf/config.yaml"]
    volumes:
      - ./config.yaml:/etc/fail2ban-ebpf/config.yaml:ro
      - ./logs:/app/logs
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /usr/lib:/usr/lib
      - /usr/lib64:/usr/lib64
      - /lib:/lib
      - /lib64:/lib64
      - /proc:/proc                # ← 新增：nginx 模块扫描宿主机进程所必需
      - /usr/sbin:/usr/sbin:ro     # ⚠️ 建议新增：确保能访问宿主机 nginx 二进制文件
    environment:
      TZ: Asia/Shanghai
